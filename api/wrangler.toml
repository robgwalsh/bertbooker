# The ONLY worker, and it serves the whole app: the Hono API below `/api/*`, and
# the built SPA for everything else (see [assets]). One worker means ONE origin,
# which is what makes the SPA's relative `fetch("/api/…")` calls work deployed
# without a base URL, a CORS dance, or a Pages Function service-binding back here.
name = "bertbooker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# A second public URL (bertbooker.<subdomain>.workers.dev) alongside the custom
# domain below. Both sit behind the same password gate, so this is a debugging
# convenience rather than a hole; set false if you want exactly one hostname.
workers_dev = true
# <version>-bertbooker.<subdomain>.workers.dev, one per deployed version. Same
# posture as workers_dev above — behind the same gate, so left on.
preview_urls = true

# D1: create with `wrangler d1 create bertbooker_db`, then paste the id below,
# REPLACING the one that is there. The committed id is the author's own — it is
# not a secret (an id identifies a database inside an account and grants nothing
# without that account's credentials) but it is meaningless on yours, and
# wrangler will say the database does not exist rather than failing quietly.
#
# Every `db:*` script and `dev:api` reads this file, and the LOCAL dev database
# is keyed by this id too — change it and `--persist-to .wrangler-local` opens a
# different, empty sqlite file. Migrations live at the repo root
# (`migrations_dir` is a property of THIS binding, not a top-level key).
[[d1_databases]]
binding = "DB"
database_name = "bertbooker_db"
database_id = "bd3e6aaf-e588-4001-8864-c3f04e0f0bd1"
migrations_dir = "../migrations"

# The SPA, served by this same worker. `directory` is resolved relative to THIS
# FILE (like migrations_dir above), not to the cwd — so this is <repo>/app/dist,
# and it must already be built when `wrangler deploy` runs. The root `deploy`
# script is what guarantees that order.
#
# `single-page-application` is what makes a hard refresh on /library or /alerts
# render the app instead of a 404: those paths match no file, so ASSETS answers
# with index.html and the client router takes over. It applies to the requests
# src/index.ts hands to env.ASSETS.fetch(), which is why that delegation is not
# optional — see the note on the default export there.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Assets are matched BEFORE the worker runs, and that quietly defeated the
# security headers: applySecurityHeaders (src/security.ts) only stamps responses
# the worker produced, and neither `/` (which matches index.html) nor `/library`
# (which the asset worker answers ITSELF, via not_found_handling above) invoked
# it. The HTML document — the one response a CSP is actually about — was the one
# response without one.
#
# `true`, not a list of paths: the SPA fallback is applied inside the asset
# worker, so every client route is served without the user worker unless ALL
# requests are routed through it. Measured, not assumed — a
# `["/", "/index.html"]` rule leaves every deep link bare.
#
# The cost is a worker invocation per static file, which for a two-person app is
# nothing. src/index.ts still delegates to env.ASSETS.fetch(), so the fallback
# behaviour above is unchanged.
run_worker_first = true

# OPTIONAL — a custom domain. Commented out on purpose: `workers_dev = true`
# above already gives a working public URL, and an uncommented route naming a
# zone your Cloudflare account does not hold FAILS the deploy rather than
# half-applying. So absent is the right default, not a placeholder domain.
#
# To use your own, uncomment both and put your zone in. Wrangler provisions the
# DNS record and certificate on first deploy; the zone must already be active on
# the account.
#
# TWO hostnames, one canonical. `www` is listed so that typing it resolves at
# all; the worker 308s it to the apex (see the redirect at the top of
# src/index.ts's fetch), so every session cookie, CORS echo and CSP is issued for
# exactly one origin. Serving both for real would split the SameSite=Strict
# cookie across two hosts and log you out by which spelling you happened to use.
# The redirect matches the `www.` prefix rather than a literal, so it needs no
# edit for your domain.
#
[[routes]]
pattern = "bertbooker.com"
custom_domain = true
enabled = true
previews_enabled = false

[[routes]]
pattern = "www.bertbooker.com"
custom_domain = true
enabled = true
previews_enabled = false

# Workers Logs. `wrangler tail bertbooker`.
#
# These used to describe only requests a human made. Since alerts, the cron
# below produces invocations nobody triggered — and because this app sends NO
# email when a sweep fails (only when it finds something), these logs and the
# Alerts tab are the two places a broken scheduler is visible. `runAlertTick` is
# therefore awaited rather than fire-and-forget, so a throw shows here as a
# failed invocation. Cloudflare's own dashboard, on its Cron Triggers tab, is the third.
[observability]
enabled = true

# THE ONE SCHEDULED THING. Read docs/ALERTS.md before changing this line.
#
# The comments below used to say "nothing is scheduled: no [triggers], no cron.
# Adding one would recreate unattended work, and unattended work hides source
# failures." That was right, and the objection is answered rather than deleted:
# every sweep is an ordinary `search_runs` row (`trigger = 'alert'`) with its
# tasks, captures and errors, surfaced in the Alerts tab beside each route's
# next-due time and consecutive-failure count. A sweep that has been failing all
# day reads as a failing sweep, not as an absence of award space — which is the
# distinction this whole architecture exists to preserve.
#
# WHY */15 AND NOT HOURLY, because it is a real trade and it was chosen: a Cron
# Trigger with an interval UNDER ONE HOUR gets 30 SECONDS of CPU, where an hourly
# one gets 15 minutes. Waiting on seats.aero is I/O and free; parsing a page of
# 500 trips-bearing rows is not. So the tick is small on purpose — one route,
# capped at ALERT_MAX_CALLS_PER_TICK — and a route needing more resumes on the
# next tick through the same `run_continue` mechanism the HTTP search uses. The
# cron is a heartbeat; how often any ONE route is actually swept is derived from
# the day's call budget divided by what the alert routes measurably cost.
[triggers]
crons = ["*/15 * * * *"]

# This worker talks to exactly TWO hosts, and the split is the rule rather than
# an exception list:
#
#   INBOUND DATA — seats.aero's Partner API (src/searchRun.ts). One source, and
#     it is allowed because it authenticates the CREDENTIAL, not the client. It
#     never calls an airline's own booking site: those judge the client, refuse
#     datacenter IPs, and — the reason the scrapers were abandoned rather than
#     fixed — gate award pricing behind a login even in a real browser. See
#     docs/HARVEST-POSTMORTEM.md. There is therefore no [browser] binding, no AI
#     binding and no relay.
#
#   OUTBOUND NOTIFICATION — Resend (src/email.ts), which is not a data source at
#     all. It is a delivery channel on exactly the same footing as seats.aero:
#     a keyed vendor API that wants the key, not a browser. Nothing about the
#     airline prohibition changes.
#
# Those two are the whole list, and there is no longer a third place for a
# source to live. A source whose posture against a datacenter IP was unmeasured
# used to declare `runtime: "local"` and run from a laptop, POSTing to
# /api/ingest/*; that source, those endpoints and that field are all gone. See
# docs/SOURCES.md. If you find yourself adding a `fetch` to an airline here, stop.

# Nothing is set here, and that is deliberate for a public repo: every value this
# worker needs is either per-deployment identity or a secret, and both belong
# outside version control. Set them with `wrangler secret put NAME` for
# production, or as lines in api/.dev.vars (gitignored) for local dev.
# See .dev.vars.example for the full list in one place.
#
# Secrets override [vars] of the same name, so if you would rather keep the
# non-sensitive four (APP_USER_EMAIL, ALERT_FROM, ALERT_ALLOWED_RECIPIENTS,
# APP_URL) in this file for your own fork, uncommenting a [vars] block here works
# and is not a downgrade — they are not secrets, merely personal.
#
# ---- Identity ----
#
# APP_USER_EMAIL is the app's single identity, and it is REQUIRED. There is no
# Cloudflare Access in front of this worker: entry is the shared password
# (src/gate.ts) and everyone who types it is the same account, sharing one set of
# tracked routes. So this is not a dev fallback — it is the signed-in user in
# production too, and src/auth.ts reads nothing else. See the docblock there for
# why the Cf-Access-* header is deliberately not consulted.
#
# Unset, the cron fails closed: scheduled() runs NO middleware, reads
# env.APP_USER_EMAIL directly, and runAlertTick refuses to start because
# search_runs.user_email is NOT NULL. That surfaces as a failed invocation in
# Workers Logs, which is the whole safety net — no email reports it.
#
# APP_PASSWORD is the shared password typed on the way in. Production:
# `wrangler secret put APP_PASSWORD`. Locally: a line in api/.dev.vars.
# NOT here — [vars] is plaintext in the repo and this is the one secret that
# guards everything else.
# Unset => every /api/* route answers 503 no_app_password, rather than waving
# traffic through. A gate that vanishes when unconfigured would publish the whole
# app on one missed deploy step.
#
# SESSION_SECRET is 32 random bytes (base64url) — the keying material for the
# 8-hour session cookie's signature. Also a secret, also fail-closed
# (503 no_session_secret), and also NOT here:
#   node -e "console.log(Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString('base64url'))"
#   wrangler secret put SESSION_SECRET
# It exists because APP_PASSWORD used to sign those tokens directly, which made
# every issued token an offline cracking oracle on the password. The signing key
# is now HKDF(SESSION_SECRET, salt = SHA-256(APP_PASSWORD)) — high-entropy, and
# still password-derived enough that rotating APP_PASSWORD signs everyone out.
# See src/gate.ts.
#
# ---- Alerts (docs/ALERTS.md). ----
#
# RESEND_API_KEY is a SECRET (`wrangler secret put RESEND_API_KEY`; locally, a
# line in api/.dev.vars). Unset => sweeps still run and still ingest,
# but every digest is recorded in `alert_deliveries` with status='skipped' and
# the reason. Never a silent drop: with no failure emails, that table is the
# only trace an undelivered digest leaves.
#
# The rest below are plain settings rather than secrets — personal, but not
# sensitive. Set them only when you want to change them; defaults are in
# bindings.ts.
#
# ALERT_FROM must be on a Resend-VERIFIED domain — the SPF/DKIM records are a
# deploy prerequisite, not a code step, and until they exist every send fails
# with the provider's own message in alert_deliveries.error. Note the sending
# domain and the app's own hostname are independent facts: there is no
# requirement that they match, and keeping a long-verified sending domain after
# moving the app is the normal case rather than an oversight.
#
# ALERT_ALLOWED_RECIPIENTS is a CSV of addresses the worker may send to.
# APP_USER_EMAIL is always included, so unset means "only the account's own
# address". That is the safe default rather than the permissive one: with one
# shared password as the only auth, an unchecked per-route alert_email would make
# this an arbitrary-recipient sender on a verified domain, and the domain's
# reputation is not something a typo should be able to spend.
#
# ALERT_DAILY_BUDGET (600) is what AUTOMATION may spend of the key's 1000/day.
# ALERT_MANUAL_RESERVE (300) is what must stay unspent so pressing Search by
#   hand always works — the number the reinstated budget guard actually exists
#   for. See docs/ALERTS.md §7.
# ALERT_MAX_CALLS_PER_TICK (25) bounds one cron tick; see the [triggers] note.
#
# APP_URL is the base for the digest's link back into the app, e.g.
# https://example.com. Unset omits the link.
#
# SEATS_AERO_API_KEY is the Partner API key POST /api/tracked-routes/:id/search
# spends. Production: `wrangler secret put SEATS_AERO_API_KEY`. Locally: a line
# in api/.dev.vars (gitignored) — NOT here.
# Unset => the search endpoint answers 503, deliberately, rather than returning
# an empty result that would read as "no award space".
