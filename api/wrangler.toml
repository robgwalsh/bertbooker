name = "bertbooker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "bertbooker_db"
database_id = "bd3e6aaf-e588-4001-8864-c3f04e0f0bd1"
migrations_dir = "../migrations"

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Assets are matched BEFORE the worker runs, and that quietly defeated the security headers
run_worker_first = true

# OPTIONAL — a custom domain. Comment out if not wanted: `workers_dev = true`
# above already gives a working public URL
[[routes]]
pattern = "bertbooker.com"
custom_domain = true
enabled = true
previews_enabled = false

[[routes]]
pattern = "www.bertbooker.com"
custom_domain = true
enabled = true
previews_enabled = false

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

# See docs/ALERTS.md
[triggers]
crons = ["*/30 * * * *"]