name: CI

# Deliberately offline and free. This runs the two checks that need no account,
# no key and no browser:
#
#   npm test      — vitest across the workspaces, hermetic (parsers vs. committed
#                   fixtures). No servers, no network.
#   npm run typecheck — tsc across the workspaces plus e2e/, which is not a
#                   workspace and so is checked explicitly.
#
# What is NOT here, on purpose:
#   - `npm run test:ui`, which needs an installed Chrome and two live servers.
#   - Anything that presses Search or runs `npm run gather`. Both spend a METERED
#     seats.aero quota against a real key, and CI is the last place that should
#     be able to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Playwright is a dev dependency of the root package, and the harness uses
      # the INSTALLED Chrome rather than a downloaded one (docs/UI-TESTING.md).
      # Skipping the download keeps this install fast; nothing in this job
      # launches a browser.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
